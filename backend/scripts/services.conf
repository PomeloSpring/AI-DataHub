# 服务注册表: name:module:port
# 唯一权威清单 —— start-all.sh / start-service.sh / kill-ports.sh / stop-all.sh 共用。
# 新增/改端口只改这里，不要在脚本里再抄一份。以 # 开头的行忽略。
#
# Phase 4 起全部模块 router 拼进一个 FastAPI app（backend.app.main），**对外只有一个监听口**：
# web :8000。vite 代理、nginx 上游（backend:8000）、Dockerfile EXPOSE、
# docker-compose 端口映射、monitoring 探测、SEMANTIC_SERVICE_URL 全部同源 8000。
# 旧 8 个契约端口（8001-8007/8012）随进程壳一并退役，不再登记 —— 端口口径若与
# 前端代理不一致会直接表现为 ECONNREFUSED，tests/test_merged_webapp.py 有护栏用例。
#
# `start-service.sh <name>` / `backend/modules/<name>/start.sh` 找不到的历史服务名
# 一律按本表唯一行解析（同一进程、同一端口，同时只能有一个在跑）。
web:backend.app.main:8000
