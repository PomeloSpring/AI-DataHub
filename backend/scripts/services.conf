# 服务注册表: name:module:port
# 唯一权威清单 —— start-all.sh / start-service.sh / kill-ports.sh 共用。
# 新增/改端口只改这里，不要在脚本里再抄一份。以 # 开头的行忽略。
#
# Phase 4 起 module 统一为合并 web 入口 backend.processes.main（全部模块 router
# 拼进一个 FastAPI app）。生产/开发经 `python -m backend.processes.serve` 一个进程
# 绑定全部端口（pids/web.pid）；name:port 保留为对外契约端口登记（vite 代理 /
# monitoring 探测按 name:port 对齐），`start-service.sh <name>` 可单端口起合并入口
# （开发多进程逃生阀）。
authservice:backend.processes.main:8006
