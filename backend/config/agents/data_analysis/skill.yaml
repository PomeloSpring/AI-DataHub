# Data Analysis Agent
name: data_analysis_agent
display_name: 数据分析
description: 检索数据库元数据、生成 SQL、执行查询、分析结果。适用于查询数据、统计分析、生成报表。
datasource_type: mysql,doris
max_retries: 2
route_patterns:
  - "查询|统计|分析|报表|多少|几个|排名|趋势|对比"
  - "SELECT|select"
  - "数据|用户|订单|设备|病例|医院"
input_schema:
  required:
    - field: "question"
      description: "用户的自然语言问题"
      format: "直接描述查询需求"
  optional:
    - field: "table"
      description: "目标表名（如已知）"
      format: "表名: <表名>"
    - field: "filter"
      description: "筛选条件"
      format: "筛选: <条件>"
