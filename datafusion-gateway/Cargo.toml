[package]
name = "datafusion-gateway"
version = "0.1.0"
edition = "2021"
description = "DataFusion-based SQL Gateway with Row-Level Security"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DataFusion
datafusion = "42"
datafusion-expr = "42"
datafusion-common = "42"
datafusion-sql = "42"
datafusion-optimizer = "42"

# Arrow
arrow = "53"
arrow-json = "53"
arrow-schema = "53"

# MySQL async client
mysql_async = "0.34"

# SQLite (for config persistence)
rusqlite = { version = "0.31", features = ["bundled"] }

# Connection pool
deadpool = { version = "0.12", features = ["managed"] }

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
once_cell = "1"
