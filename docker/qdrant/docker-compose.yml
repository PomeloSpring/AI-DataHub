version: '3.8'

# Qdrant 向量数据库 — 独立部署
# 使用方式: docker compose -f docker/qdrant/docker-compose.yml up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbi-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant-data:
