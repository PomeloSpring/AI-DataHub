# AI-DataHub 数据中台 — All-in-One Docker Compose
# 启动所有微服务 + 共享基础设施
#
# 使用方式:
#   cd services && docker compose up -d
#   或指定环境:
#   cd services && docker compose --env-file ../backend/.env up -d

version: "3.8"

x-common-env: &common-env
  METADATA_DB_TYPE: mysql
  METADATA_DB_HOST: ${METADATA_DB_HOST:-mysql}
  METADATA_DB_PORT: ${METADATA_DB_PORT:-3306}
  METADATA_DB_USER: ${METADATA_DB_USER:-root}
  METADATA_DB_PASSWORD: ${METADATA_DB_PASSWORD:-adh_test_2024}
  METADATA_DB_DATABASE: ${METADATA_DB_DATABASE:-adh}
  VECTOR_DB_TYPE: doris
  VECTOR_DB_HOST: ${VECTOR_DB_HOST:-47.116.196.2}
  VECTOR_DB_PORT: ${VECTOR_DB_PORT:-9030}
  VECTOR_DB_USER: ${VECTOR_DB_USER:-root}
  VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:-}
  VECTOR_DB_DATABASE: ${VECTOR_DB_DATABASE:-adh}
  REDIS_URL: redis://redis:6379/0
  ADH_SECRET_KEY: ${ADH_SECRET_KEY:-change-me-in-production}
  OXIGRAPH_URL: ${OXIGRAPH_URL:-http://oxigraph:7878}
  ENGINE_SERVER_URL: ${ENGINE_SERVER_URL:-http://dataengine:8082}
  ENGINE_TIMEOUT: ${ENGINE_TIMEOUT:-60}
  ENGINE_ENABLED: ${ENGINE_ENABLED:-true}

services:
  # ══════════════════════════════════════════════════════════
  # API Gateway
  # ══════════════════════════════════════════════════════════
  gateway:
    image: nginx:alpine
    container_name: adh-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - datamind
      - datagov
      - dataflow
      - dataviz
      - datacatalog
      - authservice
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # AuthService — 认证授权服务 (port 8006)
  # ══════════════════════════════════════════════════════════
  authservice:
    build:
      context: ..
      dockerfile: services/authservice/Dockerfile
    container_name: adh-authservice
    ports:
      - "8006:8006"
      - "31006:31006"
    environment:
      <<: *common-env
      SERVICE_PORT: "8006"
      MCP_PORT: "31006"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataCatalog — 数据目录服务 (port 8005)
  # ══════════════════════════════════════════════════════════
  datacatalog:
    build:
      context: ..
      dockerfile: services/datacatalog/Dockerfile
    container_name: adh-datacatalog
    ports:
      - "8005:8005"
      - "31005:31005"
    environment:
      <<: *common-env
      SERVICE_PORT: "8005"
      MCP_PORT: "31005"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataGov — 数据治理服务 (port 8002)
  # ══════════════════════════════════════════════════════════
  datagov:
    build:
      context: ..
      dockerfile: services/datagov/Dockerfile
    container_name: adh-datagov
    ports:
      - "8002:8002"
      - "31002:31002"
    environment:
      <<: *common-env
      SERVICE_PORT: "8002"
      MCP_PORT: "31002"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataViz — 可视化服务 (port 8004)
  # ══════════════════════════════════════════════════════════
  dataviz:
    build:
      context: ..
      dockerfile: services/dataviz/Dockerfile
    container_name: adh-dataviz
    ports:
      - "8004:8004"
      - "31004:31004"
    environment:
      <<: *common-env
      SERVICE_PORT: "8004"
      MCP_PORT: "31004"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataMind — AI 引擎服务 (port 8001)
  # ══════════════════════════════════════════════════════════
  datamind:
    build:
      context: ..
      dockerfile: services/datamind/Dockerfile
    container_name: adh-datamind
    ports:
      - "8001:8001"
      - "31001:31001"
    environment:
      <<: *common-env
      SERVICE_PORT: "8001"
      MCP_PORT: "31001"
      # 对象存储(附件)
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-adh-attachments}
      # Agent 工作空间沙箱(挂载 named volume)
      ADH_WORKSPACES_DIR: /app/data/workspaces
    volumes:
      - ../config:/app/config:ro
      - datamind-workspaces:/app/data/workspaces
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataFlow — 数据集成服务 (port 8003)
  # ══════════════════════════════════════════════════════════
  dataflow:
    build:
      context: ..
      dockerfile: services/dataflow/Dockerfile
    container_name: adh-dataflow
    ports:
      - "8003:8003"
      - "31003:31003"
    environment:
      <<: *common-env
      SERVICE_PORT: "8003"
      MCP_PORT: "31003"
      AIRFLOW_API_URL: ${AIRFLOW_API_URL:-http://airflow-webserver:8080/api/v1}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # SemanticLayer — 语义层服务 (port 8012)
  # BI/ChatBI -> 语义层 -> 执行层 中间层: binding/MDL/选路/护栏
  # 并含知识图谱 /api/graph (原 graphservice:8011 已并入本服务)
  # ══════════════════════════════════════════════════════════
  semhub:
    build:
      context: ..
      dockerfile: services/semhub/Dockerfile
    container_name: adh-semhub
    ports:
      - "8012:8012"
    environment:
      <<: *common-env
      SERVICE_PORT: "8012"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # Frontend
  # ══════════════════════════════════════════════════════════
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: adh-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # MinIO — S3 兼容对象存储(附件文件)
  # ══════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: adh-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # Infrastructure
  # ══════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: adh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  oxigraph:
    image: oxigraph/oxigraph:latest
    container_name: adh-oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph_data:/data
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  # DataEngine — Rust SQL 语义引擎
  # ══════════════════════════════════════════════════════════
  dataengine:
    build:
      context: /mnt/d/software/base/engine-server-rust
      dockerfile: Dockerfile
    container_name: adh-dataengine
    ports:
      - "8082:8082"
    environment:
      ENGINE_SERVER_HOST: "0.0.0.0"
      ENGINE_SERVER_PORT: "8082"
      RUST_LOG: "info"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped


volumes:
  redis_data:
  oxigraph_data:
  minio-data:
  datamind-workspaces:
