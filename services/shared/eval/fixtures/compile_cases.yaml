# Golden-question 评测用例集(离线, 断言确定性编译层的 intent->plan 解析质量)
# 数据源约定: 1=hospital(t_case_records) 2=retail(t_ticket_records) 3=hospital-PG方言
# expect: ok / error_contains / sql_contains / resolution_source{name:档位} /
#         unbound / intent_rejected / hint_no_physical(未解析提示不得泄露物理列)

# ── 仪表盘已确认范围的编译契约 ───────────────────────────
- id: dashboard_case_7d_confirmed
  question: 在 test 加近7天按创建日期的案例数量柱状图
  tags: [dashboard, combo, time_window, time_grain, exact]
  datasource_id: 1
  intent: {object: case, metrics: [案例数量], dimensions: [创建日期], time_column: 创建日期, time_window: 7d, time_grain: day, limit: 500}
  expect: {ok: true, resolution_source: {案例数量: dict_exact, 创建日期: dict_exact}, sql_contains: [DATE_FORMAT, INTERVAL 7 DAY]}

- id: dashboard_system_scope_cannot_resolve_business
  question: 系统用量不能借用业务案例对象
  tags: [dashboard, cross_source, unbound]
  datasource_id: 0
  intent: {object: case, metrics: [案例数量], limit: 500}
  expect: {unbound: true}

- id: dashboard_other_domain_same_name
  question: 用户选择工单业务后使用本域案例数量
  tags: [dashboard, cross_source, exact]
  datasource_id: 2
  intent: {object: case, metrics: [案例数量], dimensions: [工单日期], time_column: 工单日期, time_window: 7d, limit: 500}
  expect: {ok: true, sql_contains: [ticket_id], resolution_source: {案例数量: dict_exact}}

- id: dashboard_agent_raw_sql_rejected
  question: 仪表盘设计 Agent 不能提交裸 SQL
  tags: [dashboard, reject]
  datasource_id: 1
  intent: {object: case, sql: 'SELECT * FROM t_case_records', limit: 500}
  expect: {intent_rejected: true}

# ── Waker 定时分析的语义编译契约 ────────────────────────
- id: scheduled_waker_bound_business_intent
  question: 定时按已授权 Waker 的业务口径统计最近七天病例数
  tags: [scheduled, alias, time_window, combo]
  datasource_id: 1
  intent: {object: case, metrics: [病例数], time_column: 创建日期, time_window: 7d, limit: 100}
  expect: {ok: true, resolution_source: {病例数: dict_alias}, sql_contains: [INTERVAL 7 DAY]}

- id: scheduled_mcp_raw_sql_rejected
  question: 外部 MCP 意图提议不得附带裸 SQL
  tags: [scheduled, reject, guardrail]
  datasource_id: 1
  intent: {object: case, metrics: [案例数量], raw_sql: 'SELECT * FROM t_case_records', limit: 100}
  expect: {intent_rejected: true}

- id: scheduled_waker_system_cannot_bind_business
  question: 未选择业务域的定时意图不能借用业务对象
  tags: [scheduled, cross_source, unbound]
  datasource_id: 0
  intent: {object: case, metrics: [案例数量], limit: 100}
  expect: {unbound: true}

