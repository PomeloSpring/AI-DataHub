# AI-DataHub API Gateway — Nginx Configuration
# Routes /api/* requests to the appropriate microservice

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    # Upstream definitions for each microservice
    upstream datamind {
        server datamind:8001;
    }
    upstream datagov {
        server datagov:8002;
    }
    upstream dataflow {
        server dataflow:8003;
    }
    upstream dataviz {
        server dataviz:8004;
    }
    upstream datacatalog {
        server datacatalog:8005;
    }
    upstream authservice {
        server authservice:8006;
    }
    upstream aiplatform {
        server aiplatform:8007;
    }
    upstream frontend {
        server frontend:3000;
    }

    # Logging
    log_format gateway '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log gateway;
    error_log  /var/log/nginx/error.log warn;

    # Timeouts (LLM calls can be long)
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Buffer settings for streaming
    proxy_buffering off;
    proxy_cache off;

    server {
        listen 80;
        server_name _;

        # Health check
        location /nginx-health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ═══ AuthService ═══
        location /api/auth/ {
            proxy_pass http://authservice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/users {
            proxy_pass http://authservice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/workspaces {
            proxy_pass http://authservice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/roles {
            proxy_pass http://authservice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/audit {
            proxy_pass http://authservice;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ DataMind (AI Engine) — longer timeouts for LLM calls ═══
        location /api/chat/ {
            proxy_pass http://datamind;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            # SSE streaming support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /api/agent/ {
            proxy_pass http://datamind;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /api/pipeline/ {
            proxy_pass http://datamind;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /api/knowledge/ {
            proxy_pass http://datamind;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/knowledge-bases {
            proxy_pass http://datamind;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ DataGov (Data Governance) ═══
        location /api/quality/ {
            proxy_pass http://datagov;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/lineage/ {
            proxy_pass http://datagov;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/standards/ {
            proxy_pass http://datagov;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/security/ {
            proxy_pass http://datagov;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ DataFlow (Data Integration) ═══
        location /api/sync/ {
            proxy_pass http://dataflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/workflow/ {
            proxy_pass http://dataflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/scheduled/ {
            proxy_pass http://dataflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/notification/ {
            proxy_pass http://dataflow;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ DataViz (Visualization) ═══
        location /api/dashboard/ {
            proxy_pass http://dataviz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/charts/ {
            proxy_pass http://dataviz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/reports/ {
            proxy_pass http://dataviz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ DataCatalog ═══
        location /api/catalog/ {
            proxy_pass http://datacatalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/metadata/ {
            proxy_pass http://datacatalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/metrics/ {
            proxy_pass http://datacatalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/tags/ {
            proxy_pass http://datacatalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/glossary/ {
            proxy_pass http://datacatalog;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ AIPlatform ═══
        location /api/admin/skills {
            proxy_pass http://aiplatform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/admin/mcp-servers {
            proxy_pass http://aiplatform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/admin/agents {
            proxy_pass http://aiplatform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/admin/workflows {
            proxy_pass http://aiplatform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /api/admin/prompts {
            proxy_pass http://aiplatform;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ═══ Frontend (catch-all) ═══
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
